name: Public acceptance

on:
  push:
    branches: [main, 'codex/16-19-development']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runtime versions and package scripts
        run: |
          git rev-parse HEAD
          node --version
          python --version
          node -e 'const s=require("./package.json").scripts; console.log(JSON.stringify({test:s.test,package:s["package:source"],verify:s["verify:source"]},null,2))'
      - name: Check all public source paths before regressions
        shell: bash
        run: |
          set -o pipefail
          python -B scripts/check_public_sources.py 2>&1 | tee public-source-preflight.log
      - name: Public tests (no private replay or runtime image required)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee public-tests.log
      - name: Focused portable 16.19 regressions
        shell: bash
        run: |
          set -o pipefail
          node --test test/replay_source_integrity.test.js test/semantic_16_19_candidate.test.js test/semantic_16_19_821_integration.test.js 2>&1 | tee focused-tests.log
      - name: Build and verify public source package
        shell: bash
        run: |
          set -o pipefail
          npm run package:source 2>&1 | tee package-tests.log
          npm run verify:source 2>&1 | tee -a package-tests.log
      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-acceptance-${{ github.sha }}
          path: |
            public-source-preflight.log
            public-tests.log
            focused-tests.log
            package-tests.log
            dist/rofl-analyzer-source.zip
          if-no-files-found: warn
          retention-days: 14
